services:
  - type: web
    name: resumevision
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      # Set this to your real Gemini API key when creating the service.
      # It is intentionally not stored in the repository.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FLASK_DEBUG
        value: "false"
